[project]
name = "cython-scribbles"
version = "0.0.1"
requires-python = '>=3.13'

[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools >= 77.0.3",
  "Cython>=3.2.4,<4",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "setuptools >= 77.0.3",
  "Cython>=3.2.4,<4",
]
