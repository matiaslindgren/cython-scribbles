name: build and test

on:
  push:
    branches: main
    paths-ignore:
      - '.gitignore'
      - '*.md'

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            c_standard: c2x
          - platform: macos-15
            c_standard: c23

    name: "runs-on=${{ matrix.platform }} -std=${{ matrix.c_standard }}"
    runs-on: ${{ matrix.platform }}
    env:
      CYTHON_SCRIBBLES_C_STANDARD: ${{ matrix.c_standard }}
      HYPOTHESIS_PROFILE: fuzz

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - run: python -c "import sys; print(sys.version)"
      - run: make install_build_tools
      - run: make build_debug
      - run: make clean
      - run: make dev_install
      - run: make test
