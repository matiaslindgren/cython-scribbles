name: make test

on: [push]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.13
      - run: python -c "import sys; print(sys.version)"
      - run: pip install .[dev]
      - run: make test
